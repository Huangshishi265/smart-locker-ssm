# 接口地址（国内直连，OpenAI 兼容）
ai.zhipu.base-url=https://open.bigmodel.cn/api/paas/v4

# 你的 API Key（永久免费）
ai.zhipu.api-key=74402a84bf6c498b8e7540dd5c7feb99.1lzFmTI8jhmEGU8m

# 模型：glm-4-flash 为免费文本模型，适合简单问答/文案
ai.zhipu.model=glm-4-flash

# 超时（毫秒）
ai.zhipu.timeout-ms=10000

# 最大输出 token 数（控制成本）
ai.zhipu.max-tokens=512
